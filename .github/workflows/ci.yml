name: CI

on:
  push:
    branches: [main]
  pull_request:

# Batalkan jalur lama bila ada dorongan baru ke cabang/PR yang sama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Nilai placeholder untuk validasi env (src/data/env/client.ts). Tidak ada
  # panggilan nyata ke host ini: uji memakai Quran.com API tiruan.
  NEXT_PUBLIC_NODE_ENV: production
  NEXT_PUBLIC_API_URL: https://dev.api.example.com
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com

jobs:
  quality:
    name: Lint, typecheck, uji unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Versi yang menghasilkan bun.lock di repo ini.
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Biome (lint + format)
        run: bun run biome:check

      - name: Typecheck
        run: bun run typecheck

      - name: Uji unit
        run: bun run test

  e2e:
    name: Build + uji end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Cache browser Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Pasang Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Pasang dependensi sistem Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Build produksi (dengan Quran.com API tiruan)
        run: bun run build:e2e

      - name: Uji end-to-end
        run: bun run test:e2e

      - name: Unggah laporan uji
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
